# PROD: external RDS + real S3. Cloudflare proxies (orange-cloud, SSL "Full")
# to the origin's public :443 — so the box publishes 80 (HTTP→HTTPS redirect)
# and 443 (TLS) to all interfaces, and Traefik terminates TLS with a self-signed
# origin cert. Cloudflare "Full" (not "Full (strict)") trusts the self-signed
# leaf, so no ACME/public CA is needed at the origin. `!override` replaces the
# base's 80/443/5173 mapping and drops the public 5173 smoke port.
services:
  proxy:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      PLATFORM_TLS_MODE: self-signed

  # RDS infra metrics (storage-fill / burst-balance / connections) — these live
  # ONLY in CloudWatch. Read-only metric API via the instance role (~$1-2/mo at
  # 300s). NOT CloudWatch Logs. Scraped by Alloy at cloudwatch-exporter:9106.
  cloudwatch-exporter:
    image: prom/cloudwatch-exporter:v0.16.0
    profiles: [obs-agent]
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ./infra/cloudwatch-exporter/rds.yml:/config/config.yml:ro
    command: ["9106", "/config/config.yml"]
    networks: [seta-internal, seta-edge]
