# PROD: external RDS + real S3. NOT publicly exposed — but the host-side
# cloudflared tunnel must still reach Traefik, so publish HTTP to LOOPBACK only
# (the EC2 security group has zero inbound; loopback is not externally reachable).
# `!override` replaces the base's 80/443/5173 with a single loopback HTTP port.
services:
  proxy:
    ports: !override
      - "127.0.0.1:8080:80"
    environment:
      # No inbound 80 ⇒ ACME HTTP-01 is impossible. Terminate TLS at Cloudflare
      # (Full mode) and serve plain HTTP on the origin behind the tunnel.
      PLATFORM_TLS_MODE: none

  # RDS infra metrics (storage-fill / burst-balance / connections) — these live
  # ONLY in CloudWatch. Read-only metric API via the instance role (~$1-2/mo at
  # 300s). NOT CloudWatch Logs. Scraped by Alloy at cloudwatch-exporter:9106.
  cloudwatch-exporter:
    image: prom/cloudwatch-exporter:v0.16.0
    profiles: [obs-agent]
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ./infra/cloudwatch-exporter/rds.yml:/config/config.yml:ro
    command: ["9106", "/config/config.yml"]
    networks: [seta-internal, seta-edge]
