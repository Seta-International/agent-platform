# Prometheus config for the SHARED monitoring stack running on the GPU/app host
# (192.168.90.127), started via infra/docker/compose.monitoring.yml.
#
# vLLM and dcgm-exporter run as Docker on this same box and bind 0.0.0.0, so the
# Prometheus container reaches them through host.docker.internal (host-gateway).
# The app (seta-server/worker) emits agent_llm_* — point those targets at wherever
# the app actually runs (same box → host.docker.internal; dev laptop → its LAN IP).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # vLLM server-side metrics (throughput, batching, queue depth).
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: vllm

  # NVIDIA GPU metrics (utilization, VRAM) from dcgm-exporter on this host.
  - job_name: dcgm
    static_configs:
      - targets: ['host.docker.internal:9400']
        labels:
          service: gpu

  # App-side per-tenant agent_llm_* metrics. Adjust target to the host running
  # the app: host.docker.internal if co-located here, else the app host's IP.
  - job_name: seta-server
    static_configs:
      - targets: ['host.docker.internal:9464']
        labels:
          service: seta-server

  - job_name: seta-worker
    static_configs:
      - targets: ['host.docker.internal:9465']
        labels:
          service: seta-worker
