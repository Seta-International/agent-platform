# Database health via postgres-exporter (pg_*). dev+uat = warning; prod gets its
# own critical duplicate below plus RDS/cloudwatch storage alerts (Phase 4).
groups:
  - name: database
    rules:
      - alert: PostgresDown
        expr: pg_up{env!="prod"} == 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Postgres down ({{ $labels.env }})"
          description: "pg_up==0 for 1m — DB unreachable from the exporter."

      - alert: PostgresDown
        expr: pg_up{env="prod"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "[PROD] Postgres down"
          description: "pg_up==0 for 1m — DB unreachable from the exporter."

      - alert: PostgresTooManyConns
        expr: sum by (env) (pg_stat_activity_count) > 0.8 * max by (env) (pg_settings_max_connections)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Postgres connections >80% ({{ $labels.env }})"
          description: "Active connections above 80% of max_connections for 10m."

      # Rate-windowed, not the dashboard's cumulative-since-startup ratio: a
      # long-uptime server's lifetime ratio barely moves, so it can't detect a
      # recent regression the way a 10m window can.
      - alert: PostgresLowCacheHitRatio
        expr: |
          sum by (env) (rate(pg_stat_database_blks_hit[10m]))
          / (sum by (env) (rate(pg_stat_database_blks_hit[10m])) + sum by (env) (rate(pg_stat_database_blks_read[10m])))
          * 100 < 95
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Postgres cache hit ratio <95% ({{ $labels.env }})"
          description: "Buffer cache hit ratio below 95% over a 10m window, sustained 30m — working set exceeds shared_buffers or an index is missing."

      # RDS is prod-only (CloudWatch is monitored for prod alone). Storage-fill is
      # the #1 single-box-RDS killer — same threshold philosophy as HostHighDisk.
      - alert: RDSFreeStorageLow
        expr: aws_rds_free_storage_space_average < 5e9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "[PROD] RDS free storage < 5GB"
          description: "aws_rds_free_storage_space_average below 5GB for 10m — plan a storage increase."

      - alert: RDSFreeStorageCritical
        expr: aws_rds_free_storage_space_average < 2e9
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "[PROD] RDS free storage < 2GB"
          description: "aws_rds_free_storage_space_average below 2GB for 5m — imminent risk of write failures."
