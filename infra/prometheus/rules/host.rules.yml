# Host / instance health. Sourced from the node-exporter mixin, trimmed.
# dev+uat = warning; prod gets its own critical duplicates.
groups:
  - name: host
    rules:
      - alert: HostDown
        expr: up{env!="prod", instance=~"node-exporter.*"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Host down ({{ $labels.env }}/{{ $labels.instance }})"
          description: "node-exporter has been unreachable for 2m — host or box down."

      - alert: HostDown
        expr: up{env="prod", instance=~"node-exporter.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "[PROD] Host down ({{ $labels.instance }})"
          description: "node-exporter has been unreachable for 2m — host or box down."

      # Whole env stopped reporting → box down / Alloy dead / network cut.
      # One alert per deployed env with an exporter (dev, uat, prod).
      - alert: EnvNotReporting
        expr: absent(up{env="uat", instance=~"node-exporter.*"})
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "uat is not reporting metrics"
          description: "No node-exporter series for env=uat for 5m — box down, Alloy dead, or network cut."

      - alert: EnvNotReporting
        expr: absent(up{env="prod", instance=~"node-exporter.*"})
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "[PROD] prod is not reporting metrics"
          description: "No node-exporter series for env=prod for 5m — box down, Alloy dead, or network cut."

      # Saturation is two-tier: ≥85% is the early warning on every env, ≥90% on prod
      # escalates the same signal to critical (faster Alertmanager route). A prod box
      # past 90 matches both, so alertmanager.yml inhibits the warning twin.
      - alert: HostHighCpu
        expr: 100 - (avg by (env, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) >= 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'High CPU {{ $value | printf "%.0f" }}% ({{ $labels.env }}/{{ $labels.instance }})'
          description: 'CPU at {{ $value | printf "%.1f" }}% for 10m — warns from 85%.'

      - alert: HostHighCpu
        expr: 100 - (avg by (env, instance) (rate(node_cpu_seconds_total{mode="idle", env="prod"}[5m])) * 100) >= 90
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: '[PROD] High CPU {{ $value | printf "%.0f" }}% ({{ $labels.instance }})'
          description: 'CPU at {{ $value | printf "%.1f" }}% for 10m — critical from 90%.'

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 >= 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'High memory {{ $value | printf "%.0f" }}% ({{ $labels.env }}/{{ $labels.instance }})'
          description: 'Memory at {{ $value | printf "%.1f" }}% for 10m — warns from 85%.'

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes{env="prod"} / node_memory_MemTotal_bytes{env="prod"}) * 100 >= 90
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: '[PROD] High memory {{ $value | printf "%.0f" }}% ({{ $labels.instance }})'
          description: 'Memory at {{ $value | printf "%.1f" }}% for 10m — critical from 90%.'
