global:
  scrape_interval: 30s
# Receives remote_write from env Alloy agents (enabled via the CLI flag above).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
