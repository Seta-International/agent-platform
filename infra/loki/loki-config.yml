auth_enabled: false   # front auth is handled at the Cloudflare edge (basic-auth)
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 720h            # 30 days
  # Multi-env agents push with clock skew and bursty container logs; the defaults
  # reject those (observed: push.go reject errors). Tolerate skew + raise per-stream
  # limits so ingestion stops erroring. Trim to the confirmed cause at review time.
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # accept up to 7d-old lines (out-of-order/skew)
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
