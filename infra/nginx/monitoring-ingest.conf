# Public-facing ingest proxy for the central stack (FUT-388 Phase 4). Reached via
# a plain Cloudflare-proxied DNS record (same pattern as dev-future/uat-future,
# not a Tunnel) on a Cloudflare-supported HTTPS port — see compose.monitoring.yaml.
# This is the ONLY externally-reachable surface of the central monitoring stack;
# Grafana/Prometheus/Loki UIs stay LAN/VPN-only. Basic-auth-gated, and scoped to
# exactly the two push endpoints prod's Alloy needs: Prometheus remote_write and
# Loki push. Everything else 404s. Self-signed cert — Cloudflare's "Full" SSL
# mode (matching dev/uat's Traefik self-signed setup) doesn't validate the chain.
server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    auth_basic "seta-monitoring-ingest";
    auth_basic_user_file /etc/nginx/secrets/.htpasswd;

    location = /api/v1/write {
        proxy_pass http://prometheus:9090/api/v1/write;
        proxy_set_header Host $host;
    }

    location = /loki/api/v1/push {
        proxy_pass http://loki:3100/loki/api/v1/push;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
