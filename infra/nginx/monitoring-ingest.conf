# Public-facing ingest proxy for the central stack (FUT-388 Phase 4). Reached
# via dev's Traefik (Host-routed at infra/traefik/dynamic/routes.yml — Traefik
# terminates the public TLS on future-ingest.seta-international.com; this hop
# is host-local plain HTTP, not internet-facing). This is the ONLY externally
# reachable surface of the central monitoring stack; Grafana/Prometheus/Loki
# UIs stay LAN/VPN-only. Basic-auth-gated, and scoped to exactly the two push
# endpoints prod's Alloy needs: Prometheus remote_write and Loki push.
# Everything else 404s.
server {
    listen 8080;

    auth_basic "seta-monitoring-ingest";
    auth_basic_user_file /etc/nginx/secrets/.htpasswd;

    location = /api/v1/write {
        proxy_pass http://prometheus:9090/api/v1/write;
        proxy_set_header Host $host;
    }

    location = /loki/api/v1/push {
        proxy_pass http://loki:3100/loki/api/v1/push;
        proxy_set_header Host $host;
    }

    # OTLP from developer machines (Claude Code usage telemetry). Same basic-auth gate;
    # the credential is shared and write-only, so dev.email is a self-declared label, not
    # an authenticated identity. Metadata only — content capture is disabled client-side.
    location = /v1/metrics {
        proxy_pass http://prometheus:9090/api/v1/otlp/v1/metrics;
        proxy_set_header Host $host;
    }

    location = /v1/logs {
        proxy_pass http://loki:3100/otlp/v1/logs;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
