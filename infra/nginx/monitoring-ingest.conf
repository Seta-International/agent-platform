# Public-facing ingest proxy for the central stack (FUT-388 Phase 4). Fronted by
# a Cloudflare Tunnel — this is the ONLY externally-reachable surface of the
# central monitoring stack; Grafana/Prometheus/Loki UIs stay LAN/VPN-only.
# Basic-auth-gated, and scoped to exactly the two push endpoints prod's Alloy
# needs: Prometheus remote_write and Loki push. Everything else 404s.
server {
    listen 8080;

    auth_basic "seta-monitoring-ingest";
    auth_basic_user_file /etc/nginx/secrets/.htpasswd;

    location = /api/v1/write {
        proxy_pass http://prometheus:9090/api/v1/write;
        proxy_set_header Host $host;
    }

    location = /loki/api/v1/push {
        proxy_pass http://loki:3100/loki/api/v1/push;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
