# Alertmanager — single MS Teams receiver (Power Automate Workflow webhook).
# Routing by env+severity; the webhook URL is a mounted secret (never committed).
# Card layout comes from templates.tmpl (teams.title / teams.text).
templates:
  - /etc/alertmanager/templates.tmpl

route:
  receiver: teams
  group_by: [env, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical: notify fast.
    - receiver: teams
      matchers: [ severity="critical" ]
      group_wait: 10s

# When an env goes fully dark, send one "env not reporting" alert instead of a
# storm of per-target down alerts for that same env.
inhibit_rules:
  - source_matchers: [ alertname="EnvNotReporting" ]
    target_matchers: [ alertname=~"HostDown|PostgresDown|AppTargetDown" ]
    equal: [ env ]
  # A dark GPU box: send GpuNotReporting, mute the stale temp/VRAM alerts it spawns.
  - source_matchers: [ alertname="GpuNotReporting" ]
    target_matchers: [ alertname=~"GpuHot|GpuVramCritical" ]
    equal: [ env ]
  # Two-tier saturation: a prod box past its critical threshold still matches the
  # ≥85% warning it grew out of. Send the critical alone. Keeping alertname in equal
  # is what stops this from muting an unrelated warning on the same box.
  - source_matchers: [ severity="critical" ]
    target_matchers: [ severity="warning" ]
    equal: [ alertname, env, instance ]
  # Same pairing for disk, which escalates by alertname instead of by severity tier.
  - source_matchers: [ alertname="DiskCritical" ]
    target_matchers: [ alertname="DiskHighUsage" ]
    equal: [ env, instance, mountpoint ]

receivers:
  - name: teams
    msteamsv2_configs:
      - send_resolved: true
        webhook_url_file: /etc/alertmanager/secrets/teams_webhook_url
        title: '{{ template "teams.title" . }}'
        text: '{{ template "teams.text" . }}'
