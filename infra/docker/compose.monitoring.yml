# Shared monitoring stack (Prometheus + Grafana) for the GPU/app host.
# Run here so the whole team can view the dashboards over the LAN — Grafana
# enables anonymous read-only viewing, no login to look.
#
#   docker compose -f infra/docker/compose.monitoring.yml up -d
#
# Team opens:  http://<gpu-host>:3000   (read-only, no login)
# Admins edit: same URL, log in top-right with admin / $GF_ADMIN_PASSWORD.
#
# Before first run, set a real admin password and the host's LAN address
# (used for Grafana link/share rendering):
#   export GF_ADMIN_PASSWORD='something-strong'
#   export MONITORING_HOST=<gpu-host LAN address>
#
# `name:` pins this stack's compose project name to its historical default
# ("docker", from the infra/docker/ directory name) so other compose stacks
# whose files also happen to sit in a folder named "docker" (e.g.
# ai-sdlc-metrics's own compose.yml) can never be treated as orphans of this
# one and get reaped on `up`.
name: docker

services:
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: seta-monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/prometheus/prometheus.server.yml:/etc/prometheus/prometheus.yml:ro
      - seta-monitoring-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.0.1
    container_name: seta-monitoring-grafana
    restart: unless-stopped
    environment:
      # Admin login for editing. Override via `export GF_ADMIN_PASSWORD=...`.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anyone on the LAN can VIEW dashboards without logging in (read-only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Set so links/shares render with the right host.
      GF_SERVER_ROOT_URL: "http://${MONITORING_HOST:-localhost}:3000"
    ports:
      - "3000:3000"
    volumes:
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - seta-monitoring-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  seta-monitoring-prometheus-data:
  seta-monitoring-grafana-data:
