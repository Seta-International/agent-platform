- schemaVersion: 1
  kind: conversation
  id: MU-003
  category: happy
  suites: [smoke, regression]
  actor: { tenantId: a2-tenant, userId: member }
  fixtures: [plainTask]
  turns:
    # The plan is named. A2 asking WHICH plan when it cannot tell is MU-019's
    # subject, not this case's.
    - user: "tạo task 'Write release notes' trong plan A2 Plan"
      expected:
        behavior: confirm
        dbEffects: none
        trajectory:
          requiredTools: [planner_createTask]
          maxToolCalls: 3
          argPredicates:
            - {
                tool: planner_createTask,
                path: title,
                operator: equals,
                value: 'Write release notes',
              }
    - decision: { chosen: primary }
      expected:
        # No `after`: the new task's id is minted by the write, so the case cannot
        # name it. The row count is the assertion.
        behavior: applied
        dbEffects: { rowsChanged: 1 }
  metrics: { enabled: [M1, M2, M3, B1] }

