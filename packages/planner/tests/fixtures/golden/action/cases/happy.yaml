- schemaVersion: 1
  kind: conversation
  id: MU-009
  category: happy
  suites: [smoke, regression]
  actor: { tenantId: a2-tenant, userId: member }
  fixtures: [nearDuplicatePair]
  turns:
    # WHICH side survives is stated, because merge is the only thing A2 does that
    # removes anything and it must never choose for the user.
    - user: "gộp task 'Deploy API v1' vào 'Deploy API', giữ lại 'Deploy API'"
      expected:
        behavior: confirm
        dbEffects: none
        trajectory: { requiredTools: [planner_mergeTasks], maxToolCalls: 4 }
    - decision: { chosen: primary }
      expected:
        behavior: applied
        # rowsChanged is a FACT about the merge domain, not a preference: the
        # duplicate's soft-delete plus the reference row the merge writes. If the
        # first run reports a different count, read `changedKeys` in the report and
        # correct this number — do not weaken the `after` row to make it pass.
        dbEffects:
          rowsChanged: 2
          after: [{ table: planner.tasks, id: fixtures.duplicate, deleted_at: notNull }]
  metrics: { enabled: [M1, M2, M3, B1] }

- schemaVersion: 1
  kind: conversation
  id: MU-010
  category: cancel
  suites: [regression]
  actor: { tenantId: a2-tenant, userId: member }
  fixtures: [nearDuplicatePair]
  turns:
    - user: "gộp task 'Deploy API v1' vào 'Deploy API', giữ lại 'Deploy API'"
      expected:
        behavior: confirm
        dbEffects: none
        trajectory: { requiredTools: [planner_mergeTasks], maxToolCalls: 4 }
    - decision: { chosen: decline }
      expected:
        behavior: declined
        # Spelled out rather than `none`, plus the row itself: "the task the user
        # nearly deleted is still here" is the strongest thing this case can say.
        dbEffects:
          rowsChanged: 0
          after: [{ table: planner.tasks, id: fixtures.duplicate, deleted_at: null }]
  metrics: { enabled: [M4, M3] }

