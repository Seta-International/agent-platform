# MU-001..012 — one happy and one cancel case per write operation (spec §7).
#
# The cancel half needs no new mechanism: the driver simply does not resume, so
# "cancel writes nothing" is deterministic once the case exists. That is why M4's
# threshold is 1.00, and why these are the cheapest cases in the set rather than the
# dearest.

- schemaVersion: 1
  kind: conversation
  id: MU-001
  category: happy
  suites: [smoke, regression]
  actor: { tenantId: a2-tenant, userId: member }
  fixtures: [oneTaskDueAug15]
  turns:
    - user: 'đổi due date của Deploy API sang 19/8'
      expected:
        behavior: confirm
        dbEffects: none
        trajectory:
          requiredTools: [planner_updateTask]
          maxToolCalls: 3
          argPredicates:
            - { tool: planner_updateTask, path: patch.dueAt, operator: equals, value: '2026-08-19' }
    - decision: { chosen: primary }
      expected:
        behavior: applied
        dbEffects:
          rowsChanged: 1
          after: [{ table: planner.tasks, id: fixtures.task, due_at: '2026-08-19' }]
  metrics: { enabled: [M1, M2, M3, B1] }

