# Factual / happy-path query-agent cases (migrated from testcases.csv PQ-001..PQ-018).
# All are kind:agent. Crisp numbers in the original ground_truth came from fictional
# tool mocks, not the golden manifest, so they are kept as prose reference cases
# (behavior:answer, no fact refs) per plan §D.
- schemaVersion: 1
  kind: agent
  id: PQ-001
  category: happy
  suites: [smoke, regression]
  holdout: false
  actor: &actor { tenantId: '00000000-aaaa-0000-0000-000000000001', userId: '00000000-bbbb-0000-0000-000000000001' }
  input:
    messages:
      - role: user
        content: What tasks are due this week on board Alpha?
  expected:
    behavior: answer
    trajectory:
      requiredTools: [planner_queryTasksAgent, planner_queryTasks]
      forbiddenTools: [planner_createTask, planner_assignTask, planner_postComment]
  metrics: { enabled: [A1] }

