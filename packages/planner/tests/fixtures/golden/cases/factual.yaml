      - role: user
        content: How many open tasks do I have?
  expected:
    behavior: answer
    trajectory:
      requiredTools: [planner_queryTasksAgent, planner_getOpenTaskCountForUser]
      # The open-task count must come from the tool, not be invented (PQ-003
      # previously fabricated "14"): every number in the answer must trace to a
      # tool result or the user's text.
      groundNumbers: true
  # A1 gates deterministically; B2/B4 are advisory LLM-judge signals
  # (faithfulness/answer-relevancy) exercised by the E2E quality lane.
  metrics: { enabled: [A1, B2, B4] }

