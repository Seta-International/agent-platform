# PQ-012 / PQ-012b are a matched pair testing "my group" disambiguation.
# The default actor (Anh) belongs to THREE groups (owner of Engineering,
# member of Platform + DevOps), so "my group" is ambiguous -> the agent must
# ask which group (clarify). Tuan belongs to ONE group (Engineering), so the
# same question is unambiguous -> the agent answers the member count directly.
- schemaVersion: 1
  kind: agent
  id: PQ-012
  category: happy
  suites: [smoke, regression]
  holdout: false
  actor: *actor # multi-group actor -> "my group" is ambiguous
  input:
    messages:
      - role: user
        content: How many members are in my group?
  expected:
    # Actor is in 3 groups: the only correct response is to ask which one.
    behavior: clarify
    trajectory:
      # The agent must ask which group BEFORE touching any group data. Routing
      # to the team-info sub-agent is fine (that's where the ambiguity is seen),
      # but pulling a group overview/workload before the user picks would mean
      # the agent guessed a group (or, worse, fabricated a total across all
      # three) — so those data tools are forbidden here, not merely absent.
      requiredTools: []
      allowedTools: [planner_teamInfoAgent, planner_listPlans]
      forbiddenTools:
        [
          planner_getGroupOverview,
          planner_getWorkload,
          planner_createTask,
          planner_assignTask,
          planner_postComment,
        ]
  metrics: { enabled: [A1] }

- schemaVersion: 1
  kind: agent
  id: PQ-012b
  category: happy
  suites: [smoke, regression]
  holdout: false
  # Tuan is a member of Engineering only -> "my group" is unambiguous.
  actor: { tenantId: '00000000-aaaa-4000-8000-000000000001', userId: '00000000-bbbb-4000-8000-000000000002' }
  input:
    messages:
      - role: user
        content: How many members are in my group?
  expected:
    behavior: answer
    trajectory:
      requiredTools: [planner_teamInfoAgent, planner_getGroupOverview]
      groundNumbers: true
  metrics: { enabled: [A1] }

