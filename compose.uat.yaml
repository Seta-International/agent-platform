# UAT: external RDS + real S3. Alt host ports so it can co-reside with another
# stack. e2e-report served behind Traefik (profile e2e-report).
services:
  proxy:
    ports:
      - "${HTTP_BIND:-8080}:80"
      - "${HTTPS_BIND:-8443}:443"
      - "${SMOKE_BIND:-8173}:5173"

  e2e-report:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    profiles: [e2e-report]
    networks: [seta-edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes:
      - e2e-reports:/usr/share/nginx/html:ro

  # RDS infra metrics (storage-fill / burst-balance / connections) — these live
  # ONLY in CloudWatch. Read-only metric API. uat has no instance role, so it uses
  # dedicated CloudWatch-read IAM keys (the S3 keys are bucket-scoped and can't read
  # CloudWatch). Alloy scrapes this at CLOUDWATCH_TARGET=cloudwatch-exporter:9106.
  cloudwatch-exporter:
    image: prom/cloudwatch-exporter:v0.16.0
    profiles: [obs-agent]
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${CLOUDWATCH_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${CLOUDWATCH_SECRET_ACCESS_KEY}
    volumes:
      - ./infra/cloudwatch-exporter/rds.yml:/config/config.yml:ro
    command: ["9106", "/config/config.yml"]
    networks: [seta-internal, seta-edge]
