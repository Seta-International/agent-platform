# Central observability stack (runs on the VPS). Receives remote_write (metrics)
# + loki push (logs) from every env's Alloy agent; single Grafana over all envs.
# Alertmanager wiring (email + MS 365 Teams) is the separate follow-up slice.
services:
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.central.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.central.yml:/etc/prometheus/prometheus.central.yml:ro
      - seta-monitoring-prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki-config.yml]
    ports: ["3100:3100"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - seta-monitoring-loki-data:/loki

  grafana:
    image: grafana/grafana:12.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD}  # fail if unset — no admin/admin fallback
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - seta-monitoring-grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]

volumes:
  seta-monitoring-prometheus-data:
  seta-monitoring-loki-data:
  seta-monitoring-grafana-data:
