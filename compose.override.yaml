# LOCAL LAPTOP ONLY (auto-loaded by `docker compose up`). Deployed boxes pin
# COMPOSE_FILE explicitly and never load this. Bundled Postgres + MinIO keep
# fresh-machine onboarding zero-AWS.

volumes:
  minio-data:

networks:
  seta-admin: { driver: bridge }   # loopback publish for SSH-tunneled DB access

services:
  postgres:
    container_name: seta-ap-postgres-dev
    environment:
      POSTGRES_USER: seta
      POSTGRES_PASSWORD: seta
      POSTGRES_DB: seta
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5542}:5432"
    networks: [seta-internal, seta-admin]

  server:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

  worker:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-seta-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-seta-dev-secret}
    volumes:
      - minio-data:/data
    networks: [seta-internal, seta-edge]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    networks: [seta-internal]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY_ID:-seta-dev}" "${S3_SECRET_ACCESS_KEY:-seta-dev-secret}" &&
        mc mb --ignore-existing "local/${S3_BUCKET:-seta-knowledge}"
