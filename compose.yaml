# Seta self-host production stack.
#
# Usage:
#   cp .env.example .env && $EDITOR .env    # fill in required secrets
#   docker compose up -d
#   docker compose logs -f server
#
# Architecture:
#   - proxy (Traefik v3) owns port 443 (and 80 for ACME redirect).
#   - web serves the React bundle.
#   - server runs the Hono API + workers (PLATFORM_MODULES=* = all-in-one).
#   - postgres is pgvector/pg17.
#   - migrator is a one-shot that runs Drizzle migrations and exits.
#
# Boundary: only `proxy` is publicly exposed. All other services are reachable
# only via the `seta-edge` and `seta-internal` networks.
#
# This is the BASE stack — env-specific overlays (dev/uat/prod) extend it via
# `compose.override.yaml` / `compose.<env>.yaml`.

name: seta

x-app-image: &app-image ${PLATFORM_IMAGE_SERVER:-${ECR_REGISTRY}/${ECR_REPOSITORY}:server-${PLATFORM_VERSION:-latest}}

# Shared env for server/worker/migrator/seeder — defined ONCE.
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_APP_URL: ${DATABASE_APP_URL:-}
  PLATFORM_MODULES: ${PLATFORM_MODULES:-*}
  EVENTS_RETENTION_DAYS: ${EVENTS_RETENTION_DAYS:-30}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  M365_WEBHOOK_SECRET: ${M365_WEBHOOK_SECRET:-}
  MAILER_DEFAULT_TRANSPORT: ${MAILER_DEFAULT_TRANSPORT:-}
  MAILER_DEFAULT_SENDER: ${MAILER_DEFAULT_SENDER:-}
  MAILER_DEFAULT_SENDER_DISPLAY_NAME: ${MAILER_DEFAULT_SENDER_DISPLAY_NAME:-}
  MAILER_DEFAULT_SMTP_URL: ${MAILER_DEFAULT_SMTP_URL:-}
  MAILER_GRAPH_CLIENT_ID: ${MAILER_GRAPH_CLIENT_ID:-}
  MAILER_GRAPH_CLIENT_SECRET: ${MAILER_GRAPH_CLIENT_SECRET:-}
  CRYPTO_KEY_PROVIDER: ${CRYPTO_KEY_PROVIDER:-env}
  CRYPTO_KMS_KEY_ARN: ${CRYPTO_KMS_KEY_ARN:-}
  CRYPTO_LOCAL_MASTER_KEY: ${CRYPTO_LOCAL_MASTER_KEY:-}
  CRYPTO_LOCAL_KEYS: ${CRYPTO_LOCAL_KEYS:-}
  CRYPTO_LOCAL_PRIMARY_KID: ${CRYPTO_LOCAL_PRIMARY_KID:-}
  AWS_REGION: ${AWS_REGION:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENT_MODELS: ${AGENT_MODELS:-}
  AGENT_MODEL_DEFAULT: ${AGENT_MODEL_DEFAULT:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  VLLM_BASE_URL: ${VLLM_BASE_URL:-}
  VLLM_API_KEY: ${VLLM_API_KEY:-}
  LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-}
  LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
  EMBED_MODEL: ${EMBED_MODEL:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_PROMETHEUS_PORT: 9464
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

x-app-base: &app-base
  image: *app-image
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]

networks:
  seta-edge: { driver: bridge }
  seta-internal: { driver: bridge, internal: true }

volumes:
  postgres-data:
  traefik-acme:
  e2e-reports:

services:
  proxy:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
      - "${SMOKE_BIND:-5173}:5173"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
    environment:
      PLATFORM_ACME_EMAIL: ${PLATFORM_ACME_EMAIL}
    # Lets the monitoring-ingest route (routes.yml) reach the host-published
    # port of a container in a different compose project (FUT-388 Phase 4).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [seta-edge]

  web:
    image: ${PLATFORM_IMAGE_WEB:-${ECR_REGISTRY}/${ECR_REPOSITORY}:web-${PLATFORM_VERSION:-latest}}
    restart: unless-stopped
    networks: [seta-edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]

  server:
    <<: *app-base
    command: [serve]
    environment:
      <<: *app-env
      PORT: ${PORT:-3000}
      PUBLIC_URL: ${PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-strict}
    expose: ["9464"]           # Prometheus metrics — standardized port
    networks: [seta-edge, seta-internal]
    depends_on:
      postgres: { condition: service_healthy, required: false }
      migrator: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  worker:
    <<: *app-base
    command: [worker]
    environment: *app-env
    expose: ["9464"]
    networks: [seta-internal, seta-edge]
    depends_on:
      postgres: { condition: service_healthy, required: false }
      migrator: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: ["CMD-SHELL", "/entrypoint.sh health || exit 1"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3

  migrator:
    <<: *app-base
    restart: "no"
    command: [migrate]
    environment: *app-env
    networks: [seta-internal, seta-edge]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  seeder:
    <<: *app-base
    restart: "no"
    profiles: [seed]
    command: [seed]
    environment:
      <<: *app-env
      M365_GRAPH_TENANT_ID: ${M365_GRAPH_TENANT_ID:-}
      M365_GRAPH_CLIENT_ID: ${M365_GRAPH_CLIENT_ID:-}
      M365_GRAPH_CLIENT_SECRET: ${M365_GRAPH_CLIENT_SECRET:-}
    networks: [seta-internal, seta-edge]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    profiles: [bundled-db]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [seta-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Grafana Alloy — one agent per DEPLOYED env: scrapes app :9464 → remote_write
  # to central Prometheus AND tails container logs → push to central Loki.
  # Off by default (profile) so the local laptop never runs it; dev/uat/prod
  # enable it via COMPOSE_PROFILES=obs-agent.
  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [obs-agent]
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy]
    environment:
      MONITORING_ENV: ${MONITORING_ENV:-dev}
      REMOTE_WRITE_URL: ${REMOTE_WRITE_URL:-}
      LOKI_URL: ${LOKI_URL:-}
      REMOTE_WRITE_USERNAME: ${REMOTE_WRITE_USERNAME:-}
      REMOTE_WRITE_PASSWORD: ${REMOTE_WRITE_PASSWORD:-}
      # RDS cloudwatch-exporter target — CloudWatch is monitored for PROD only, so
      # this is set solely in the prod env; empty for dev/uat → no phantom target.
      CLOUDWATCH_TARGET: ${CLOUDWATCH_TARGET:-}
      # DCGM GPU exporter target — set only on the dev agent (co-located with the
      # on-prem GPU box). dcgm-exporter publishes :9400 on the host, so reach it via
      # the host gateway: DCGM_TARGET=host.docker.internal:9400. Empty elsewhere.
      DCGM_TARGET: ${DCGM_TARGET:-}
      # cAdvisor target — prod-only (see compose.prod.yaml); empty for dev/uat.
      CADVISOR_TARGET: ${CADVISOR_TARGET:-}
    # Lets the agent reach host-published exporter ports (e.g. dcgm-exporter:9400,
    # which lives on the default bridge, not this compose network).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [seta-internal, seta-edge]

  # Host metrics (cpu/mem/DISK) — disk-full is the #1 single-box killer.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [obs-agent]
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [seta-internal]

  # Postgres internals (connections, db size, query stats).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [obs-agent]
    restart: unless-stopped
    environment:
      # The exporter's Go pq driver rejects the app's sslmode=no-verify, so it
      # needs a dedicated DSN with a supported sslmode: disable for bundled
      # Postgres (dev, no server SSL), require for RDS (uat/prod, encrypt over
      # the internet). Falls back to DATABASE_URL for local dev where SSL is off.
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-${DATABASE_URL}}
    networks: [seta-internal, seta-edge]
