name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint PR title
        run: echo "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Validate branch name
        run: bash scripts/check-branch-name.sh "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm biome ci .

      - run: pnpm lint:boundaries

      - run: pnpm depcruise

      - run: pnpm lint

      - name: Run tests
        run: pnpm test
        env:
          # testcontainers needs to find Docker; default socket on ubuntu-latest.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Build web bundle
        run: pnpm --filter @seta/web build

      - name: Check per-app bundle budgets
        run: pnpm --filter @seta/web size

      - name: Upload bundle visualizer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle-stats
          path: apps/web/dist/stats.html
          if-no-files-found: warn
