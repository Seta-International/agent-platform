name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint PR title
        run: echo "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Validate branch name
        run: bash scripts/check-branch-name.sh "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Persist Turbo's local cache across runs. Unchanged packages hit the
      # cache and skip typecheck/test entirely. restore-keys lets a PR reuse
      # the newest cache from any prior run (typically the base branch).
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Run tests
        run: pnpm test
        env:
          # testcontainers needs to find Docker; default socket on ubuntu-latest.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Dashboards match source (no drift)
        run: |
          pnpm gen:dashboards
          git diff --exit-code infra/grafana/dashboards \
            || (echo "::error::infra/grafana/dashboards is out of sync with dashboards-src — run 'pnpm gen:dashboards'"; exit 1)

      - name: Build web bundle
        run: pnpm --filter @seta/web build

      - name: Check per-app bundle budgets
        run: pnpm --filter @seta/web size

      - name: Upload bundle visualizer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle-stats
          path: apps/web/dist/stats.html
          if-no-files-found: warn

  compose-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate every env's compose renders
        env:
          S3_BUCKET: lint
          REMOTE_WRITE_URL: https://lint
          LOKI_URL: https://lint
          GF_ADMIN_PASSWORD: lint
        run: |
          set -euo pipefail
          for env in override dev uat prod; do
            docker compose -f compose.yaml -f compose.$env.yaml config -q
          done
          docker compose -f compose.monitoring.yaml config -q
          echo "all compose files render"

      - name: Validate Prometheus alert rules + Alertmanager config
        run: |
          set -euo pipefail
          # Glob so every rule file (incl. new ones) is validated without hand-maintaining
          # a list; sh entrypoint expands the glob in-container. Mirrors deploy-monitoring.yml.
          docker run --rm --entrypoint sh -v "$PWD/infra/prometheus/rules:/r:ro" \
            prom/prometheus:v3.4.0 -c 'promtool check rules /r/*.yml'
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$PWD/infra/alertmanager/templates.tmpl:/etc/alertmanager/templates.tmpl:ro" \
            prom/alertmanager:v0.28.0 check-config /etc/alertmanager/alertmanager.yml
          echo "monitoring rules + routing valid"

      - name: Validate Alloy agent config
        run: |
          docker run --rm -v "$PWD/infra/alloy/config.alloy:/c.alloy:ro" \
            grafana/alloy:v1.10.0 fmt /c.alloy > /dev/null
          echo "alloy config valid"
