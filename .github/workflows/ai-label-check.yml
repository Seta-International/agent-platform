name: AI Label Check

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes('ai-assisted') && !labels.includes('ai-agent')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '⚠️ **AI label missing** — please add one before merging:',
                  '- `ai-assisted` if AI helped with any part of this PR',
                  '- `ai-assisted` **+ `ai-agent`** if an agent (Claude Code) created this PR',
                  '',
                  'This keeps the AI SDLC metrics accurate. You can merge without it — this is a reminder only.',
                ].join('\n'),
              });
            }
