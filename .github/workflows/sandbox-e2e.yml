name: sandbox-e2e

# End-to-end sandbox provision into the personal sandbox AWS account.
# OIDC-assumes the gha-sandbox role, applies the greenfield stack, builds+pushes
# the arm64 image, seeds secrets (as TF vars), migrates, deploys, verifies health
# inside the VPC, then destroys. Account id + state bucket are derived at runtime.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: e2e (apply+verify+destroy) | apply | destroy | plan
        type: choice
        default: e2e
        options: [e2e, apply, destroy, plan]
  # Push trigger so the workflow can run from this feature branch before it
  # reaches the default branch (workflow_dispatch requires default-branch
  # presence). Remove once merged to main; dispatch is the long-term entrypoint.
  push:
    branches: [chore/FUT-620-terraform-sandbox]

concurrency: sandbox-e2e

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_DIR: infra/terraform/sandbox
  ECR_REPO: future-app-sandbox
  STATE_BUCKET_PREFIX: seta-tfstate-sandbox

jobs:
  e2e:
    # Sandbox builds x86_64 natively on a standard runner (fast, no QEMU, no
    # arm64-runner dependency). The task defs default to X86_64 to match.
    runs-on: ubuntu-latest
    environment: sandbox
    env:
      MODE: ${{ github.event.inputs.mode || 'e2e' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SANDBOX_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account-derived values
        id: ctx
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          {
            echo "account_id=${ACCOUNT_ID}"
            echo "registry=${REGISTRY}"
            echo "image_uri=${REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"
            echo "state_bucket=${STATE_BUCKET_PREFIX}-${ACCOUNT_ID}"
          } >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ steps.ctx.outputs.state_bucket }}"

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_master_password: ${{ secrets.SANDBOX_DB_PASSWORD }}
          TF_VAR_better_auth_secret: ${{ secrets.SANDBOX_BETTER_AUTH_SECRET }}
          TF_VAR_crypto_local_master_key: ${{ secrets.SANDBOX_CRYPTO_MASTER_KEY }}
          TF_VAR_image_uri: ${{ steps.ctx.outputs.image_uri }}
        run: terraform plan -input=false

      # Create just the ECR repo first so the image can be pushed BEFORE the
      # services are created — with the circuit breaker on, creating services
      # against a not-yet-pushed image would trip the breaker.
      - name: Create ECR repo (targeted)
        if: env.MODE != 'plan' && env.MODE != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_master_password: ${{ secrets.SANDBOX_DB_PASSWORD }}
          TF_VAR_better_auth_secret: ${{ secrets.SANDBOX_BETTER_AUTH_SECRET }}
          TF_VAR_crypto_local_master_key: ${{ secrets.SANDBOX_CRYPTO_MASTER_KEY }}
          TF_VAR_image_uri: ${{ steps.ctx.outputs.image_uri }}
        run: terraform apply -input=false -auto-approve -target=module.app.aws_ecr_repository.app

      - name: Build & push image (native x86_64)
        if: env.MODE != 'plan' && env.MODE != 'destroy'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.ctx.outputs.registry }}"
          docker build \
            --build-arg SKIP_TYPECHECK=1 \
            -f infra/docker/server.Dockerfile \
            -t "${{ steps.ctx.outputs.image_uri }}" .
          docker push "${{ steps.ctx.outputs.image_uri }}"

      # Phase 1: create everything the migrate needs (cluster, task defs, network,
      # RDS, secrets) but NOT the services. The server refuses to boot against an
      # un-migrated DB (assertCaughtUpOnly -> process.exit), so services must be
      # created only after migrate — otherwise they crash-loop and trip the
      # deployment circuit breaker.
      - name: Terraform apply (pre-migrate, no services)
        if: env.MODE != 'plan' && env.MODE != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_master_password: ${{ secrets.SANDBOX_DB_PASSWORD }}
          TF_VAR_better_auth_secret: ${{ secrets.SANDBOX_BETTER_AUTH_SECRET }}
          TF_VAR_crypto_local_master_key: ${{ secrets.SANDBOX_CRYPTO_MASTER_KEY }}
          TF_VAR_image_uri: ${{ steps.ctx.outputs.image_uri }}
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.app.aws_ecs_cluster.main \
            -target=module.app.aws_ecs_task_definition.api \
            -target=module.app.aws_ecs_task_definition.worker \
            -target=module.app.aws_security_group.tasks \
            -target=module.app.aws_subnet.public

      - name: Migrate (one-off task)
        if: env.MODE != 'plan' && env.MODE != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          SUBNETS=$(terraform output -json public_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw task_security_group_id)
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"server","command":["migrate"]}]}' \
            --task-definition "${ECR_REPO}-api" \
            --query 'tasks[0].taskArn' --output text)
          TASK_ID=${TASK_ARN##*/}
          echo "migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "migrate exit=$CODE reason=$REASON"
          echo "---- migrate container logs ----"
          aws logs get-log-events \
            --log-group-name "/ecs/${ECR_REPO}/api" \
            --log-stream-name "server/server/${TASK_ID}" \
            --limit 200 --query 'events[].message' --output text 2>/dev/null || echo "(no logs)"
          test "$CODE" = "0"

      # Phase 2: now that the DB is migrated, create the services. Their tasks
      # boot healthy on the first try (image present, schema present, secrets set).
      - name: Terraform apply (full — creates services)
        if: env.MODE != 'plan' && env.MODE != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_master_password: ${{ secrets.SANDBOX_DB_PASSWORD }}
          TF_VAR_better_auth_secret: ${{ secrets.SANDBOX_BETTER_AUTH_SECRET }}
          TF_VAR_crypto_local_master_key: ${{ secrets.SANDBOX_CRYPTO_MASTER_KEY }}
          TF_VAR_image_uri: ${{ steps.ctx.outputs.image_uri }}
        run: terraform apply -input=false -auto-approve

      - name: Wait for services stable
        if: env.MODE != 'plan' && env.MODE != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          API=$(terraform output -raw api_service_name)
          WORKER=$(terraform output -raw worker_service_name)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API" "$WORKER"

      - name: Install session-manager-plugin
        if: env.MODE == 'e2e' || env.MODE == 'apply'
        run: |
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb

      - name: Verify in-VPC health
        if: env.MODE == 'e2e' || env.MODE == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          API=$(terraform output -raw api_service_name)
          TASK=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$API" \
            --desired-status RUNNING --query 'taskArns[0]' --output text)
          TID=${TASK##*/}
          echo "verifying task $TASK"
          ok=""
          for i in $(seq 1 10); do
            OUT=$(aws ecs execute-command --cluster "$CLUSTER" --task "$TASK" \
              --container server --interactive \
              --command "wget -qO- http://localhost:3000/health/ready" 2>&1 || true)
            echo "--- attempt $i ---"; echo "$OUT"
            if echo "$OUT" | grep -q '"ok":true'; then ok=1; break; fi
            sleep 6
          done
          if [ -z "$ok" ]; then
            echo "==== server container logs ===="
            aws logs get-log-events --log-group-name "/ecs/${ECR_REPO}/api" \
              --log-stream-name "server/server/${TID}" \
              --limit 200 --query 'events[].message' --output text 2>/dev/null || echo "(no logs)"
            echo "==== task health ===="
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
              --query 'tasks[0].{last:lastStatus,health:healthStatus,containers:containers[].{name:name,health:healthStatus}}' || true
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure() && (env.MODE == 'e2e' || env.MODE == 'apply')
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          CLUSTER=$(terraform output -raw cluster_name)
          API=$(terraform output -raw api_service_name)
          WORKER=$(terraform output -raw worker_service_name)
          echo "############ SERVICE DEPLOYMENTS / EVENTS ############"
          aws ecs describe-services --cluster "$CLUSTER" --services "$API" "$WORKER" \
            --query 'services[].{name:serviceName,deployments:deployments[].{status:status,rollout:rolloutState,reason:rolloutStateReason,desired:desiredCount,running:runningCount,failed:failedTasks},events:events[0:5].message}'
          for SVC in "$API" "$WORKER"; do
            echo "############ TASKS for $SVC ############"
            for T in $(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SVC" --query 'taskArns' --output text); do
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$T" \
                --query 'tasks[0].{last:lastStatus,health:healthStatus,stopped:stoppedReason,containers:containers[].{name:name,last:lastStatus,health:healthStatus,exit:exitCode,reason:reason}}'
            done
          done
          echo "############ SERVER LOGS ############"
          for S in $(aws logs describe-log-streams --log-group-name "/ecs/${ECR_REPO}/api" --order-by LastEventTime --descending --max-items 2 --query 'logStreams[].logStreamName' --output text 2>/dev/null); do
            echo "-- stream $S --"
            aws logs get-log-events --log-group-name "/ecs/${ECR_REPO}/api" --log-stream-name "$S" --limit 100 --query 'events[].message' --output text 2>/dev/null
          done
          echo "############ WORKER LOGS ############"
          for S in $(aws logs describe-log-streams --log-group-name "/ecs/${ECR_REPO}/worker" --order-by LastEventTime --descending --max-items 2 --query 'logStreams[].logStreamName' --output text 2>/dev/null); do
            echo "-- stream $S --"
            aws logs get-log-events --log-group-name "/ecs/${ECR_REPO}/worker" --log-stream-name "$S" --limit 100 --query 'events[].message' --output text 2>/dev/null
          done
          true

      - name: Terraform destroy
        if: always() && (env.MODE == 'e2e' || env.MODE == 'destroy')
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_master_password: ${{ secrets.SANDBOX_DB_PASSWORD }}
          TF_VAR_better_auth_secret: ${{ secrets.SANDBOX_BETTER_AUTH_SECRET }}
          TF_VAR_crypto_local_master_key: ${{ secrets.SANDBOX_CRYPTO_MASTER_KEY }}
          TF_VAR_image_uri: ${{ steps.ctx.outputs.image_uri }}
        run: terraform destroy -input=false -auto-approve
