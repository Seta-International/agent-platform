name: AI SDLC Metrics — FUT

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  pull_request:
    types: [closed]
  deployment_status:
  workflow_dispatch:
    inputs:
      sprint_label:
        description: 'Sprint label (e.g. S1). Leave blank for current sprint.'
        required: false
      a1_adoption_rate:
        description: 'A1 — seat adoption rate (0-1)'
        required: false
      b5_cost_improvement_pct:
        description: 'B5 — cost improvement vs baseline (0-1)'
        required: false
      c3_ai_code_coverage_pct:
        description: 'C3 — AI code test coverage (0-1)'
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Only run on PR events if the PR was actually merged
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    permissions:
      contents: read
      pull-requests: read
      deployments: read
      security-events: read
    steps:
      - name: Checkout ai-sdlc-metrics
        uses: actions/checkout@v4
        with:
          repository: Seta-International/ai-sdlc-metrics
          path: ai-sdlc-metrics

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-sdlc-metrics/requirements.txt

      - run: pip install -r ai-sdlc-metrics/requirements.txt

      - name: Collect and upsert metrics
        working-directory: ai-sdlc-metrics
        env:
          METRICS_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          REPORTING_DB_URL: ${{ secrets.REPORTING_DB_URL }}
          JIRA_AI_USAGE_FIELD: ${{ secrets.JIRA_AI_USAGE_FIELD }}
          GH_REPO: seta-international/agent-platform
          JIRA_PROJECT: FUT
          PROJECT_LABEL: FUT
        run: |
          ARGS=""
          [ -n "${{ inputs.sprint_label }}" ]         && ARGS="$ARGS --sprint ${{ inputs.sprint_label }}"
          [ -n "${{ inputs.a1_adoption_rate }}" ]      && ARGS="$ARGS --a1 ${{ inputs.a1_adoption_rate }}"
          [ -n "${{ inputs.b5_cost_improvement_pct }}" ] && ARGS="$ARGS --b5 ${{ inputs.b5_cost_improvement_pct }}"
          [ -n "${{ inputs.c3_ai_code_coverage_pct }}" ] && ARGS="$ARGS --c3 ${{ inputs.c3_ai_code_coverage_pct }}"
          python -m collector.collect --project FUT $ARGS
