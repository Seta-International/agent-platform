name: Dev Release

# Builds images locally on the `future` self-hosted runner and deploys the dev
# stack — no ECR/AWS. This is the only release path.
# Requires: runner labeled `future`, Ollama on 0.0.0.0:11434 (gemma4:12b-it-qat),
# repo vars DEV_APP_DOMAIN / OLLAMA_BASE_URL and secret OPENAI_API_KEY.

on:
  workflow_dispatch:

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Build + deploy to dev (future)
    runs-on: [self-hosted, future]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Derive dev version from SHA
        id: meta
        shell: bash
        run: echo "version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build server + web images locally
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          echo "=== Building seta-server:${VERSION} ==="
          DOCKER_BUILDKIT=1 docker build -f infra/docker/server.Dockerfile -t "seta-server:${VERSION}" .
          echo "=== Building seta-web:${VERSION} ==="
          DOCKER_BUILDKIT=1 docker build -f infra/docker/web.Dockerfile -t "seta-web:${VERSION}" .

      - name: Write runtime .env (self-hosted Gemma + OpenAI embeddings)
        shell: bash
        env:
          VERSION:         ${{ steps.meta.outputs.version }}
          DEV_APP_DOMAIN:  ${{ vars.DEV_APP_DOMAIN }}
          # Public origin browsers actually use (e.g. the Cloudflare domain in
          # front of this host). Drives better-auth trustedOrigins + CORS. Falls
          # back to the internal IP. DEV_APP_DOMAIN stays internal (Traefik cert,
          # smoke test) since Traefik path-routes any host.
          DEV_PUBLIC_URL:  ${{ vars.DEV_PUBLIC_URL }}
          # Browser-facing S3 endpoint. When the app is public (Cloudflare), the
          # presigned-URL host must be publicly reachable + trusted — point this
          # at a CF-proxied s3 subdomain (routed to MinIO by the Traefik step
          # below). Unset → falls back to the internal endpoint from $SECRETS_FILE.
          DEV_S3_ENDPOINT: ${{ vars.DEV_S3_ENDPOINT }}
          ACME_EMAIL:      ${{ vars.ACME_EMAIL || 'devops@seta-international.vn' }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://192.168.90.127:11434/v1' }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          # Entra SSO (optional) + M365 change-notification webhook signing.
          MICROSOFT_CLIENT_ID:     ${{ vars.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          M365_WEBHOOK_SECRET:     ${{ secrets.M365_WEBHOOK_SECRET }}
          # Outbound mail via Office 365 SMTP + optional Graph /sendMail.
          MAILER_DEFAULT_SMTP_URL:    ${{ secrets.MAILER_DEFAULT_SMTP_URL }}
          MAILER_GRAPH_CLIENT_ID:     ${{ vars.MAILER_GRAPH_CLIENT_ID }}
          MAILER_GRAPH_CLIENT_SECRET: ${{ secrets.MAILER_GRAPH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          # Persist generated secrets across deploys (survive redeploys without
          # living in GitHub Secrets). Delete this file to re-init the DB cleanly.
          SECRETS_FILE="$HOME/.seta-dev-secrets.env"
          if [ ! -f "$SECRETS_FILE" ]; then
            echo "=== First deploy: generating persistent app secrets ==="
            printf 'POSTGRES_PASSWORD=%s\nBETTER_AUTH_SECRET=%s\nCRYPTO_LOCAL_MASTER_KEY=%s\n' \
              "$(openssl rand -hex 16)" \
              "$(openssl rand -hex 32)" \
              "$(openssl rand -hex 32)" > "$SECRETS_FILE"
            chmod 600 "$SECRETS_FILE"
          fi
          # shellcheck source=/dev/null
          source "$SECRETS_FILE"

          cat > .env.deploy <<EOF
          NODE_ENV=production
          PLATFORM_IMAGE_SERVER=seta-server:${VERSION}
          PLATFORM_IMAGE_WEB=seta-web:${VERSION}
          PLATFORM_VERSION=${VERSION}
          PLATFORM_MODULES=*
          PLATFORM_DOMAIN=${DEV_APP_DOMAIN}
          PLATFORM_TLS_MODE=self-signed
          PLATFORM_ACME_EMAIL=${ACME_EMAIL}
          DATABASE_URL=postgres://seta:${POSTGRES_PASSWORD}@postgres:5432/seta
          POSTGRES_USER=seta
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=seta
          PORT=3000
          PUBLIC_URL=${DEV_PUBLIC_URL:-https://${DEV_APP_DOMAIN}}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          CRYPTO_KEY_PROVIDER=env
          CRYPTO_LOCAL_MASTER_KEY=${CRYPTO_LOCAL_MASTER_KEY}
          CORS_ORIGINS=${DEV_PUBLIC_URL:-https://${DEV_APP_DOMAIN}}
          SESSION_COOKIE_SAMESITE=strict
          EVENTS_RETENTION_DAYS=30
          KNOWLEDGE_AV_REQUIRED=false
          MAILER_DEFAULT_TRANSPORT=smtp
          # Office 365 rejects From addresses the authenticated mailbox can't send as.
          MAILER_DEFAULT_SENDER=llm@seta-international.vn
          MAILER_DEFAULT_SMTP_URL=${MAILER_DEFAULT_SMTP_URL}
          MAILER_GRAPH_CLIENT_ID=${MAILER_GRAPH_CLIENT_ID}
          MAILER_GRAPH_CLIENT_SECRET=${MAILER_GRAPH_CLIENT_SECRET}
          # ── Self-hosted chat model: Gemma 4 12B (QAT) via Ollama on this host ──
          AGENT_MODELS=ollama/gemma4:12b-it-qat:balanced
          AGENT_MODEL_DEFAULT=auto
          OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
          # Embeddings stay on OpenAI — pgvector columns are sized to its dims.
          EMBED_MODEL=openai/text-embedding-3-small
          OPENAI_API_KEY=${OPENAI_API_KEY}
          MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
          MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
          M365_WEBHOOK_SECRET=${M365_WEBHOOK_SECRET}
          EOF

          # S3 object storage — provided by the standalone MinIO installed on this
          # host (creds persisted in $SECRETS_FILE). Absent → app keeps its S3
          # defaults. When the endpoint is self-signed, S3_CA_FILE points at the
          # MinIO CA so the server/worker can trust it (mounted by compose.yml).
          if [ -n "${S3_ENDPOINT:-}" ]; then
          cat >> .env.deploy <<EOF
          S3_REGION=${S3_REGION:-ap-southeast-1}
          S3_ENDPOINT=${DEV_S3_ENDPOINT:-${S3_ENDPOINT}}
          S3_BUCKET=${S3_BUCKET:-seta-knowledge}
          S3_FORCE_PATH_STYLE=true
          S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
          EOF
          if [ -n "${S3_CA_FILE:-}" ]; then
          cat >> .env.deploy <<EOF
          S3_CA_FILE=${S3_CA_FILE}
          NODE_EXTRA_CA_CERTS=/etc/ssl/minio-ca.crt
          EOF
          fi
          fi
          chmod 600 .env.deploy

      # Dev-only: route the public CF-proxied s3 subdomain to the standalone
      # MinIO via Traefik (real cert at the CF edge; Traefik talks to MinIO's
      # self-signed backend with insecureSkipVerify). Generated here so the dev
      # hostname stays out of the shared infra/traefik config.
      - name: Route public S3 subdomain through Traefik to MinIO
        if: ${{ vars.DEV_S3_ENDPOINT != '' }}
        shell: bash
        env:
          DEV_S3_ENDPOINT: ${{ vars.DEV_S3_ENDPOINT }}
          MINIO_BACKEND:   ${{ vars.DEV_MINIO_BACKEND || 'https://192.168.90.127:9000' }}
        run: |
          set -euo pipefail
          host="${DEV_S3_ENDPOINT#http*://}"; host="${host%%/*}"
          {
            printf 'http:\n'
            printf '  routers:\n'
            printf '    minio:\n'
            printf '      rule: "Host(`%s`)"\n' "$host"
            printf '      entryPoints: [websecure]\n'
            printf '      service: minio\n'
            printf '      priority: 200\n'
            printf '      tls: {}\n'
            printf '  services:\n'
            printf '    minio:\n'
            printf '      loadBalancer:\n'
            printf '        passHostHeader: true\n'
            printf '        servers:\n'
            printf '          - url: "%s"\n' "$MINIO_BACKEND"
            printf '        serversTransport: minio-insecure\n'
            printf '  serversTransports:\n'
            printf '    minio-insecure:\n'
            printf '      insecureSkipVerify: true\n'
          } > infra/traefik/dynamic/minio.yml
          echo "wrote Traefik route ${host} -> ${MINIO_BACKEND}"
          cat infra/traefik/dynamic/minio.yml

      - name: Migrate and bring up the stack (locally built images)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.deploy run --rm migrator
          docker compose --env-file .env.deploy up -d \
            --remove-orphans --wait --wait-timeout 300 \
            proxy server web worker

      - name: Smoke test (health/ready + model reachability)
        shell: bash
        env:
          DEV_APP_DOMAIN:  ${{ vars.DEV_APP_DOMAIN }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://192.168.90.127:11434/v1' }}
        run: |
          set -euo pipefail
          echo "=== Ollama reachable? ==="
          curl -sf "${OLLAMA_BASE_URL%/v1}/api/tags" >/dev/null \
            && echo "ok: ollama responding" \
            || { echo "❌ Ollama not reachable at ${OLLAMA_BASE_URL}"; exit 1; }

          echo "=== App health/ready ==="
          code=000
          for i in $(seq 1 12); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" \
              --max-time 5 "https://${DEV_APP_DOMAIN}/health/ready" || true)
            [ "$code" = "200" ] && break
            echo "  attempt $i/12: HTTP $code — retrying in 5s…"
            sleep 5
          done
          [ "$code" = "200" ] \
            || { echo "❌ Smoke test failed (last HTTP status: $code)"; exit 1; }
          echo "✅ Dev deploy healthy"
