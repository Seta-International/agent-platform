name: Hackathon — Deploy infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'tofu action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

  push:
    branches: [main]
    paths:
      - 'hackathon/infra/**'
      - '.github/workflows/hackathon-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: tofu ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    environment: hackathon

    defaults:
      run:
        working-directory: hackathon/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: hackathon-deploy-${{ github.run_id }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.1
        with:
          tofu_version: "1.12.0"

      - name: tofu init
        run: tofu init -backend=false

      - name: tofu fmt check
        run: tofu fmt -check

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == ''
        run: tofu plan -input=false
        env:
          TF_VAR_postgres_password:    ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
          TF_VAR_better_auth_secret:   ${{ secrets.TF_VAR_BETTER_AUTH_SECRET }}
          TF_VAR_openai_api_key:       ${{ secrets.TF_VAR_OPENAI_API_KEY }}
          TF_VAR_copilot_model:        ${{ secrets.TF_VAR_COPILOT_MODEL }}
          TF_VAR_domain:               ${{ secrets.TF_VAR_DOMAIN }}
          TF_VAR_acme_email:           ${{ secrets.TF_VAR_ACME_EMAIL }}
          TF_VAR_key_name:             ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_allowed_ssh_cidrs:    ${{ secrets.TF_VAR_ALLOWED_SSH_CIDRS }}
          TF_VAR_jaeger_auth_password: ${{ secrets.TF_VAR_JAEGER_AUTH_PASSWORD }}

      - name: tofu apply
        if: github.event.inputs.action == 'apply'
        run: tofu apply -auto-approve -input=false
        env:
          TF_VAR_postgres_password:    ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
          TF_VAR_better_auth_secret:   ${{ secrets.TF_VAR_BETTER_AUTH_SECRET }}
          TF_VAR_openai_api_key:       ${{ secrets.TF_VAR_OPENAI_API_KEY }}
          TF_VAR_copilot_model:        ${{ secrets.TF_VAR_COPILOT_MODEL }}
          TF_VAR_domain:               ${{ secrets.TF_VAR_DOMAIN }}
          TF_VAR_acme_email:           ${{ secrets.TF_VAR_ACME_EMAIL }}
          TF_VAR_key_name:             ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_allowed_ssh_cidrs:    ${{ secrets.TF_VAR_ALLOWED_SSH_CIDRS }}
          TF_VAR_jaeger_auth_password: ${{ secrets.TF_VAR_JAEGER_AUTH_PASSWORD }}

      - name: tofu destroy
        if: github.event.inputs.action == 'destroy'
        run: tofu destroy -auto-approve -input=false
        env:
          TF_VAR_postgres_password:    ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
          TF_VAR_better_auth_secret:   ${{ secrets.TF_VAR_BETTER_AUTH_SECRET }}
          TF_VAR_openai_api_key:       ${{ secrets.TF_VAR_OPENAI_API_KEY }}
          TF_VAR_copilot_model:        ${{ secrets.TF_VAR_COPILOT_MODEL }}
          TF_VAR_domain:               ${{ secrets.TF_VAR_DOMAIN }}
          TF_VAR_acme_email:           ${{ secrets.TF_VAR_ACME_EMAIL }}
          TF_VAR_key_name:             ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_allowed_ssh_cidrs:    ${{ secrets.TF_VAR_ALLOWED_SSH_CIDRS }}
          TF_VAR_jaeger_auth_password: ${{ secrets.TF_VAR_JAEGER_AUTH_PASSWORD }}
