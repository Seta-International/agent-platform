name: Build & Publish Images

# Build server + web once and push to ECR; every env deploys by pulling these tags.
# Server is multi-arch (amd64 compose boxes + x86 ECS, arm64 ECS Graviton): each
# arch builds on its native runner and pushes by digest, then a job merges them
# into one manifest tag — replaces the QEMU build that made cold caches 20-40 min.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default: this branch HEAD)'
        required: false
        type: string
      arch:
        description: 'Server architectures to build'
        required: false
        type: choice
        default: both
        options:
          - both
          - amd64
          - arm64
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      arch:
        required: false
        type: string
        default: both
    outputs:
      image_tag:
        description: 'Immutable git-<sha> tag that was pushed'
        value: ${{ jobs.prep.outputs.image_tag }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC for AWS
  contents: read

env:
  IMAGE_REPO: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}

jobs:
  prep:
    name: Prepare tag + arch matrix
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      matrix: ${{ steps.mtx.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Derive immutable tag from SHA
        id: meta
        shell: bash
        run: echo "image_tag=git-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build server arch matrix from the arch input
        id: mtx
        shell: bash
        env:
          ARCH: ${{ inputs.arch || 'both' }}
        run: |
          set -euo pipefail
          amd='{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}'
          arm='{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}'
          case "$ARCH" in
            amd64) inc="[$amd]" ;;
            arm64) inc="[$arm]" ;;
            both)  inc="[$amd,$arm]" ;;
            *) echo "::error::unknown arch '$ARCH' (expected both|amd64|arm64)"; exit 1 ;;
          esac
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  server:
    name: Build server (${{ matrix.arch }})
    needs: prep
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build + push server by digest
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/docker/server.Dockerfile
          platforms: ${{ matrix.platform }}
          # Push by digest (no tag); the manifest job tags the merged list.
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache-server-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache-server-${{ matrix.arch }},mode=max
          # Plain manifests (no unknown/unknown) so imagetools merges cleanly.
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-server-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  server-manifest:
    name: Merge server manifest
    needs: [prep, server]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-server-*
          merge-multiple: true

      - name: Create + push multi-arch manifest
        working-directory: /tmp/digests
        shell: bash
        env:
          TAG: ${{ needs.prep.outputs.image_tag }}
        run: |
          set -euo pipefail
          sources=()
          for d in *; do sources+=("${IMAGE_REPO}@sha256:${d}"); done
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:server-${TAG}" \
            -t "${IMAGE_REPO}:server-latest" \
            "${sources[@]}"

      - name: Inspect
        shell: bash
        env:
          TAG: ${{ needs.prep.outputs.image_tag }}
        run: docker buildx imagetools inspect "${IMAGE_REPO}:server-${TAG}"

  web:
    name: Build web (amd64)
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build + push web
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:web-${{ needs.prep.outputs.image_tag }}
            ${{ env.IMAGE_REPO }}:web-latest
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache-web
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache-web,mode=max
          provenance: false
          sbom: false

  summary:
    name: Summary
    needs: [prep, server-manifest, web]
    runs-on: ubuntu-latest
    steps:
      - name: Write build summary
        shell: bash
        env:
          TAG: ${{ needs.prep.outputs.image_tag }}
          ARCH: ${{ inputs.arch || 'both' }}
        run: |
          {
            echo "### Built image"
            echo ""
            echo "- **image_tag:** \`${TAG}\`"
            echo "- **server arch:** \`${ARCH}\` (native runners, no QEMU)"
            echo "- server: \`server-${TAG}\`, \`server-latest\`"
            echo "- web: \`web-${TAG}\`, \`web-latest\`"
            echo ""
            echo "Deploy with the \`deploy\` workflow, \`image_tag = ${TAG}\` (or \`latest\`)."
          } >> "$GITHUB_STEP_SUMMARY"
